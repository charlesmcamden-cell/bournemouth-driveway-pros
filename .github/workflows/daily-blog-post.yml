name: Daily Blog Publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate site (publishes any due articles)
        run: python3 generate_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "driveway-pros-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Daily blog publish"
            git push
          else
            echo "Nothing to publish today."
          fi
